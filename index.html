<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Waihana — us or them?</title>
<!--
  THE BEACON — the one page that still answers when Reef does not.

  ── WHY IT EXISTS ──────────────────────────────────────────────────────────────────────────────
  Reef 502'd during a deploy on 2026-11-11 and the owner found out because he happened to be
  looking at the site. His next sentence was the whole product: "whether it was us or them". And
  what he'd have done with the answer: "nothing — i'd just know not to panic and keep working."

  ⛔ IT LIVES OUTSIDE EVERYTHING IT WATCHES. `next start` is the only web server in the Reef repo,
  so a status page hosted inside Reef is unreachable in exactly the moment it is wanted. This file
  is served as a static asset from GitHub Pages — not Railway, not Supabase, not Cloudflare, none
  of which it is allowed to depend on, because every one of them is a candidate cause.

  ⛔ NO BUILD STEP, NO DEPENDENCIES, NO CDN, NO WEBFONT. Every byte is in this file. A beacon that
  needs a CDN to render is a beacon that goes dark with the CDN. System fonts only.

  ⛔ NO SERVER, NO CRON, NO DATABASE, NO SECRETS, NO AUTH. It fetches when you open it, so it is
  current by construction — there is no stale cache and no scheduler to be late. (GitHub Actions
  schedules drift 15-30 minutes under load, which is useless for "tell me now".) It holds nothing
  worth protecting: public vendor status, plus whether waihana.com answers. That is precisely what
  makes it safe to put outside every system it monitors.

  ── WHAT IT CAN AND CANNOT KNOW ────────────────────────────────────────────────────────────────
  ⚠️ Railway has NO cross-origin status API — `/api/v1/summary` returns the SPA's HTML. That turns
  out not to matter: Railway HOSTS Reef, so "is my app on Railway reachable" is a more useful
  question than "is Railway globally healthy", and this page measures that directly by asking
  waihana.com itself. Postmark publishes no browser-readable status either; it is listed as
  unreadable rather than quietly omitted.

  ⚠️ IT MEASURES FROM WHERE YOU ARE STANDING. If your own connection is the problem, every row goes
  red — which is itself the answer, and the page says so rather than blaming Waihana.
-->
<style>
  :root {
    --bg: #0b1016; --panel: #121a23; --line: #1f2b36;
    --ink: #e8eef4; --dim: #8fa3b5; --faint: #5d7488;
    --ok: #3ddc97; --warn: #ffb547; --bad: #ff4f33;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: max(env(safe-area-inset-top), 20px) 18px max(env(safe-area-inset-bottom), 28px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 34rem; margin: 0 auto; }
  .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); margin: 0 0 14px; }
  /* The verdict is the page. Everything else is evidence for it. */
  .verdict { font-size: clamp(26px, 8vw, 38px); line-height: 1.12; font-weight: 650; letter-spacing: -.02em; margin: 0; }
  .because { color: var(--dim); margin: 10px 0 0; font-size: 15px; }
  .bar { height: 3px; border-radius: 2px; margin: 20px 0 24px; background: var(--line); }
  .bar.ok { background: var(--ok); } .bar.warn { background: var(--warn); } .bar.bad { background: var(--bad); }

  .row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--bad); } .dot.unknown { background: var(--faint); }
  .name { flex: 1 1 auto; font-weight: 500; }
  .name small { display: block; font-weight: 400; color: var(--faint); font-size: 12.5px; margin-top: 1px; }
  .state { color: var(--dim); font-size: 13.5px; text-align: right; }
  .state.bad { color: var(--bad); } .state.warn { color: var(--warn); }

  /* ⚠️ The incident title sits directly under the rule that separates it from its provider
     row, so it needs real breathing room above it — a negative margin here had it almost
     touching the line (owner, 2026-11-12). */
  .detail { padding: 11px 0 13px 21px; border-bottom: 1px solid var(--line); }
  .inc { margin: 0 0 9px; }
  .inc:last-child { margin-bottom: 0; }
  .inc b { display: block; font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .inc span { display: block; color: var(--dim); font-size: 13px; margin-top: 2px; }
  .inc em { font-style: normal; color: var(--faint); font-size: 12px; }
  h2 { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint);
       margin: 30px 0 2px; font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 14px; }
  footer { margin-top: 26px; color: var(--faint); font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  button {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
  }
  button:active { background: var(--line); }
  @media (prefers-reduced-motion: no-preference) { .spin { animation: s 1s linear infinite; } }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Waihana · Beacon</p>
  <h1 class="verdict" id="verdict">Checking…</h1>
  <p class="because" id="because">Asking Waihana and every provider it depends on.</p>
  <div class="bar" id="bar"></div>

  <h2>Waihana</h2>
  <div class="panel"><div id="self"></div></div>

  <h2>Providers</h2>
  <div class="panel"><div id="vendors"></div></div>

  <p class="because" id="probenote" style="margin-top:14px;font-size:12.5px;color:var(--faint)">
    Providers below the line publish no status page, so Reef asks their API host directly.
    “Answering” means the host responded — not that the service is healthy.
  </p>

  <footer>
    <span id="stamp">—</span>
    <button id="again" type="button">Check again</button>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* ⚠️ VERIFIED 2026-11-12: every one of these sends `Access-Control-Allow-Origin: *`, which is
     what makes a server unnecessary. Anthropic's status.anthropic.com 301s to status.claude.com —
     the final URL is used directly so the redirect cannot cost a second round trip. */
  /* ⚠️ DERIVED FROM `.env.example` — every external service this app holds a credential for.
     Owner: "i don't see higgsfield or some of the other services we use from time to time in
     there...everything with an api key plesae." Each URL verified 2026-11-12 to return JSON with
     `Access-Control-Allow-Origin: *`, which is what makes a server unnecessary. */
  var VENDORS = [
    { name: "Supabase",   note: "database, auth, storage",  url: "https://status.supabase.com/api/v2/summary.json" },
    { name: "Cloudflare", note: "DNS and edge",             url: "https://www.cloudflarestatus.com/api/v2/summary.json" },
    { name: "Shopify",    note: "orders and checkout",      url: "https://www.shopifystatus.com/api/v2/summary.json" },
    { name: "Twilio",     note: "calls and texts",          url: "https://status.twilio.com/api/v2/summary.json" },
    { name: "Claude",     note: "the assistant",            url: "https://status.claude.com/api/v2/summary.json" },
    { name: "ChatGPT",    note: "the assistant",            url: "https://status.openai.com/api/v2/summary.json" },
    { name: "LiveKit",    note: "huddles and voice",        url: "https://status.livekit.io/api/v2/summary.json" },
    { name: "Deepgram",   note: "transcription",            url: "https://status.deepgram.com/api/v2/summary.json" },
    { name: "Sentry",     note: "error reporting",          url: "https://status.sentry.io/api/v2/summary.json" },
    { name: "ElevenLabs", note: "voice synthesis",          url: "https://status.elevenlabs.io/api/v2/summary.json" },
    { name: "Dropbox",    note: "file sync",                url: "https://status.dropbox.com/api/v2/summary.json" },
    /* ⚠️ Google publishes an incident ARRAY, not a statuspage summary — handled by `kind`. */
    { name: "Google",     note: "maps and sign-in",         url: "https://status.cloud.google.com/incidents.json", kind: "gcp" }
  ];

  /* ⚠️ No browser-readable status page. Listed so their absence is a stated fact rather than a
     silent gap — Railway is covered better by the Waihana probe below, since it hosts us. */
  /**
   * ⛔ THE ONES WITH NO PUBLIC STATUS PAGE — DERIVED, NOT GIVEN UP ON.
   *
   * These nine are credentialed in `.env.example` and publish nothing a browser can read. Rather
   * than nine grey "unknown" rows, each is PROBED DIRECTLY at the host Reef actually calls (hosts
   * read out of `src/`, not guessed).
   *
   * ⚠️ HOW IT WORKS, AND WHAT IT HONESTLY PROVES. `fetch(url, {mode:"no-cors"})` returns an OPAQUE
   * response: the body cannot be read, but the promise RESOLVES when the request completed at the
   * network level and REJECTS when it did not. So this detects DNS failure, connection refused,
   * TLS failure and total outage — the things that take a vendor completely off the air.
   *
   * ⛔ IT DOES NOT PROVE THE SERVICE IS HEALTHY. An HTTP 500 resolves exactly like a 200, because
   * the status code is unreadable across origins. That is why these rows say "Answering", never
   * "Operational" — claiming health this cannot see would be the cry-wolf failure running
   * backwards, and a green row nobody should trust is worse than a grey one.
   *
   * ⚠️ Round-trip time is reported too: a host that normally answers in 100ms taking several
   * seconds is a real signal even when it technically answered.
   */
  /* ⛔ THE API HOST, NOT THE TRACKING-LINK HOST. `www.fedex.com` and `www.dhl.com` appear in
     `src/lib/shipping/tracking.ts` — they are the customer-facing links we PUT IN EMAILS, not the
     endpoints that create labels (`apis.fedex.com`, `api-eu.dhl.com`, from `src/lib/shipping/fedex.ts`
     and `src/lib/shipments/carriers/dhl.ts`). Probing the marketing site would report FedEx healthy
     while label creation was dead — a green row that means nothing. Derived from src/, 2026-11-12. */
  var PROBES = [
    { name: "Postmark",        note: "email sending",       url: "https://api.postmarkapp.com/" },
    { name: "Higgsfield",      note: "image and video gen", url: "https://api.higgsfield.ai/" },
    { name: "Meta / Instagram", note: "social publishing",  url: "https://graph.facebook.com/" },
    { name: "FedEx",           note: "shipping labels",     url: "https://apis.fedex.com/" },
    { name: "DHL",             note: "shipping labels",     url: "https://api-eu.dhl.com/" },
    { name: "Pexels",          note: "stock imagery",       url: "https://api.pexels.com/" },
    { name: "Pixabay",         note: "stock imagery",       url: "https://pixabay.com/" },
    { name: "Freesound",       note: "sound effects",       url: "https://freesound.org/" }
  ];
  /* Railway is deliberately absent: it HOSTS Reef, so the waihana.com check above is a better
     answer about Railway than probing railway.com would be. */

  var HEALTH = "https://staff.waihana.com/api/health";
  var RANK = { none: 0, minor: 1, major: 2, critical: 3 };
  var el = function (id) { return document.getElementById(id); };

  function withTimeout(ms) {
    var c = new AbortController();
    setTimeout(function () { c.abort(); }, ms);
    return c.signal;
  }

  function row(name, note, cls, state) {
    var d = document.createElement("div");
    d.className = "row";
    d.innerHTML =
      '<span class="dot ' + cls + '"></span>' +
      '<span class="name"></span>' +
      '<span class="state ' + (cls === "bad" ? "bad" : cls === "warn" ? "warn" : "") + '"></span>';
    var n = d.querySelector(".name");
    n.textContent = name;
    if (note) { var s = document.createElement("small"); s.textContent = note; n.appendChild(s); }
    d.querySelector(".state").textContent = state;
    return d;
  }

  /* Is Waihana answering? Measured from THIS browser, which is the vantage point that matters —
     if the owner cannot reach it, "the server is fine" is not an answer he can use. */
  function checkSelf() {
    return fetch(HEALTH + "?t=" + Date.now(), { cache: "no-store", signal: withTimeout(9000) })
      .then(function (r) { return { up: r.ok, code: r.status }; })
      .catch(function () { return { up: false, code: 0 }; });
  }

  function checkVendor(v) {
    return fetch(v.url, { cache: "no-store", signal: withTimeout(9000) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        /* Google: an array of incidents; `end` absent means still open. No indicator field, so
           severity is inferred from whether anything is open at all. */
        if (v.kind === "gcp") {
          var openOnes = (Array.isArray(j) ? j : []).filter(function (i) { return !i.end; });
          return {
            v: v,
            indicator: openOnes.length ? "major" : "none",
            desc: openOnes.length ? "Incident open" : "All Systems Operational",
            incidents: openOnes.slice(0, 2).map(function (i) {
              return {
                name: (i.affected_products || []).map(function (p) { return p.title; }).join(", ") || "Google Cloud incident",
                body: (i.external_desc || "").replace(/\s+/g, " ").trim(),
                since: i.begin || null,
                impact: "major"
              };
            })
          };
        }
        var st = (j && j.status) || {};
        /* ⛔ INCIDENTS, NOT COMPONENTS. Cloudflare alone lists ~80 non-operational components at any
           moment — individual city PoPs under maintenance. Showing those would bury the one line
           that matters under a list nobody can read, which is how a status page gets ignored. */
        var inc = (j && j.incidents ? j.incidents : []).slice(0, 2).map(function (i) {
          var u = (i.incident_updates || [])[0] || {};
          return {
            name: i.name || "Incident",
            body: (u.body || "").replace(/\s+/g, " ").trim(),
            since: i.started_at || null,
            impact: i.impact || "none"
          };
        });
        return { v: v, indicator: st.indicator || "none", desc: st.description || "Operational", incidents: inc };
      })
      /* ⚠️ A failed read is NOT an outage. Saying "Supabase is down" because a status page would
         not load is the cry-wolf failure this page exists to avoid. */
      .catch(function () { return { v: v, indicator: "unknown", desc: "Can’t reach status page", incidents: [] }; });
  }

  /* ⚠️ SLOW IS A VERDICT, NOT A FAILURE. The threshold is generous because this measures from
     wherever the owner is standing, which may be hotel wifi. */
  var SLOW_MS = 2500;
  function probeHost(pr) {
    var t0 = Date.now();
    return fetch(pr.url, { mode: "no-cors", cache: "no-store", signal: withTimeout(9000) })
      .then(function () {
        var ms = Date.now() - t0;
        return { p: pr, up: true, ms: ms, slow: ms > SLOW_MS };
      })
      .catch(function () { return { p: pr, up: false, ms: Date.now() - t0, slow: false }; });
  }

  function classOf(ind) {
    if (ind === "none") return "ok";
    if (ind === "minor") return "warn";
    if (ind === "major" || ind === "critical") return "bad";
    return "unknown";
  }

  function render(self, results, probes) {
    var selfBox = el("self");
    selfBox.textContent = "";
    selfBox.appendChild(
      self.up
        ? row("waihana.com", "answering normally", "ok", "Up")
        : row("waihana.com", self.code ? "responded " + self.code : "no response", "bad", "Not answering")
    );

    var box = el("vendors");
    box.textContent = "";
    results
      .slice()
      .sort(function (a, b) { return (RANK[b.indicator] || 0) - (RANK[a.indicator] || 0); })
      .forEach(function (r) {
        box.appendChild(row(r.v.name, r.v.note, classOf(r.indicator), r.desc));
        /* ⚠️ The owner's ask: "i think we should have the full provider description of the
           partially degraded service for me to see so i don't have to go and look it up myself."
           Only on a row that is actually degraded — a healthy provider gets no block. */
        if (r.indicator !== "none" && r.indicator !== "unknown" && r.incidents && r.incidents.length) {
          var d = document.createElement("div");
          d.className = "detail";
          r.incidents.forEach(function (i) {
            var w = document.createElement("p");
            w.className = "inc";
            var b = document.createElement("b");
            b.textContent = i.name;
            var sp = document.createElement("span");
            sp.textContent = i.body || "No detail published yet.";
            w.appendChild(b);
            w.appendChild(sp);
            if (i.since) {
              var e2 = document.createElement("em");
              var t = new Date(i.since);
              e2.textContent = "since " + t.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
              w.appendChild(e2);
            }
            d.appendChild(w);
          });
          box.appendChild(d);
        }
      });
    probes
      .slice()
      .sort(function (a, b) { return (a.up ? 1 : 0) - (b.up ? 1 : 0); })
      .forEach(function (r) {
        box.appendChild(
          row(
            r.p.name,
            r.p.note,
            r.up ? (r.slow ? "warn" : "ok") : "bad",
            /* ⛔ "Answering", never "Operational" — see the PROBES comment for why. */
            r.up ? (r.slow ? "Answering, slowly (" + r.ms + "ms)" : "Answering (" + r.ms + "ms)") : "Not answering"
          )
        );
      });

    /* ── THE VERDICT ──────────────────────────────────────────────────────────────────────────
       ⛔ The "likely us" branch is the one that matters. On 2026-11-11 Railway's status page said
       all systems operational while Reef was 502ing, because the cause was our own deploy rolling
       out. A page that only ever reported vendor incidents would have shrugged at the very event
       it was built for. */
    /* A probed host that is not answering at all counts as "them" for the verdict — it is the
       strongest signal these vendors can give, even if it cannot say why. */
    var deadProbes = probes.filter(function (r) { return !r.up; });
    var hurting = results.filter(function (r) { return r.indicator === "major" || r.indicator === "critical"; });

    /**
     * ⛔ THE SENTENCE HAS TO MATCH THE EVIDENCE, AND THE TWO KINDS ARE NOT THE SAME FACT. A
     * vendor with a readable feed is REPORTING an incident — it told us so itself. A probed host
     * is only NOT ANSWERING: the response is opaque, so there is no status code to read and no
     * incident to quote. Calling that "a major incident" would invent knowledge this page does
     * not have, which is the exact failure the row labels were written to avoid — it would be
     * careless to be scrupulous in the row and loose in the headline.
     */
    function nameList(xs) { return xs.join(xs.length > 2 ? ", " : " and "); }
    function themClause() {
      var parts = [];
      if (hurting.length) {
        parts.push(nameList(hurting.map(function (r) { return r.v.name; })) +
          (hurting.length > 1 ? " are" : " is") + " reporting a major incident");
      }
      if (deadProbes.length) {
        parts.push(nameList(deadProbes.map(function (r) { return r.p.name; })) +
          (deadProbes.length > 1 ? " are" : " is") + " not answering");
      }
      return parts.join(", and ");
    }
    var themCount = hurting.length + deadProbes.length;
    var minor = results.filter(function (r) { return r.indicator === "minor"; });
    var unreadable = results.filter(function (r) { return r.indicator === "unknown"; });
    var v = el("verdict"), b = el("because"), bar = el("bar");

    if (!self.up && themCount) {
      v.textContent = "Probably them.";
      b.textContent = "Waihana isn’t answering, and " + themClause() + ". Sit tight.";
      bar.className = "bar bad";
    } else if (!self.up) {
      v.textContent = "Probably us.";
      b.textContent = "Waihana isn’t answering and every provider reports normal service. Check whether a deploy is rolling out — that is the usual cause, and it clears on its own in a few minutes.";
      bar.className = "bar bad";
    } else if (themCount) {
      v.textContent = "Waihana is up.";
      b.textContent = themClause() + ", so anything that depends on " +
        (themCount > 1 ? "them" : "it") + " may fail. Everything else is fine.";
      bar.className = "bar warn";
    } else if (minor.length) {
      v.textContent = "Waihana is up.";
      b.textContent = minor.map(function (r) { return r.v.name; }).join(", ") + " report minor issues. Nothing to do.";
      bar.className = "bar ok";
    } else {
      v.textContent = "All good.";
      b.textContent = unreadable.length
        ? "Waihana is answering and every provider reports normal service. " + unreadable.length + " status page" +
          (unreadable.length > 1 ? "s were" : " was") + " unreadable, which is not the same as an outage."
        : "Waihana is answering and every provider reports normal service.";
      bar.className = "bar ok";
    }

    el("stamp").textContent = "Checked " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  }

  var busy = false;
  function run() {
    if (busy) return;
    busy = true;
    var btn = el("again");
    btn.disabled = true;
    btn.textContent = "Checking…";
    Promise.all([checkSelf(), Promise.all(VENDORS.map(checkVendor)), Promise.all(PROBES.map(probeHost))])
      .then(function (out) { render(out[0], out[1], out[2]); })
      .catch(function () {
        el("verdict").textContent = "Can’t tell.";
        el("because").textContent = "This device couldn’t reach anything at all — which usually means the problem is your own connection, not Waihana.";
        el("bar").className = "bar warn";
      })
      .then(function () {
        busy = false;
        btn.disabled = false;
        btn.textContent = "Check again";
      });
  }

  el("again").addEventListener("click", run);
  /* Re-check when the phone comes back to the page — the common case is unlocking it to look. */
  document.addEventListener("visibilitychange", function () { if (!document.hidden) run(); });
  setInterval(function () { if (!document.hidden) run(); }, 60000);
  run();
})();
</script>
</body>
</html>
